# Its own stack on its own ports. Nothing here is shared with deploy/ — this
# service is meant to be startable and stoppable without touching the inbox.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: waqr
      POSTGRES_USER: waqr
      POSTGRES_PASSWORD: waqr
    volumes:
      - waqrdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waqr"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    # Chromium's own sandbox needs to create a user namespace, and Docker's
    # default seccomp filter refuses the syscall — "failed to move to new
    # namespace: Operation not permitted". The usual answer is --no-sandbox,
    # which trades away the sandbox that matters: this browser renders whatever
    # a stranger sends, and Chromium's renderer sandbox is what contains that.
    # Relaxing the outer filter to keep the inner one is the trade Puppeteer
    # documents, and the container still runs as an unprivileged user with
    # nothing but its own database to reach.
    security_opt:
      - seccomp:unconfined
    ports:
      # Bound to localhost: the panel shows a QR that links a phone, and that
      # is not something to expose to the internet by default.
      - "127.0.0.1:8300:8300"
    volumes:
      # Auth data and media. Losing this volume means every phone re-scans.
      - ./data:/data
      # The panel is static files with no build step, so it is mounted rather
      # than baked in: a change to it should be a copy and a reload, not a
      # rebuild of an image whose slowest layer is a browser.
      - ./public:/app/public:ro

volumes:
  waqrdata:
