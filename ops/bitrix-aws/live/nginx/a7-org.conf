# A7 Org & Security API — reverse proxy for the Hostinger console only.
#
# Install into the Bitrix env's site settings, next to the recordings entry:
#   /etc/nginx/bx/site_settings/default/a7-org.conf
# then reload nginx. The Bitrix vhost already includes that directory.
#
# Only the Hostinger VPS (and localhost, for on-box testing) may reach it; every
# request is still HMAC-verified by the app behind this.

location /a7-org/ {
    allow 187.127.123.235;   # Hostinger VPS (srv1802669)
    allow 127.0.0.1;
    deny all;

    proxy_pass http://127.0.0.1:8789/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;
}
