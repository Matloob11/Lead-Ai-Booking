# A7: apply REST + lead_guard throttles (custom; survives Bitrix updates)
# Included from ssl.s1.conf via bx/site_settings/default/*.conf
#
# ^~ /rest/ wins over generic locations. Non-limited IPs pass through
# with no delay because their map key is empty.

location ^~ /rest/ {
    # telephony callers (Zadarma/Voiso) — empty key for others => no-op
    limit_req zone=a7_zv_api burst=30;
    # Hostinger + AWS: nodelay so excess is 429 (does not queue Apache workers)
    limit_req zone=a7_host_api burst=20 nodelay;
    limit_req_status 429;

    proxy_pass $proxyserver;
}

# Browser lead-guard poll — cap per client IP so open tabs cannot flood PHP.
location = /bitrix/tools/a7_lead_guard_api.php {
    limit_req zone=a7_lg_api burst=8;
    limit_req_status 429;

    proxy_pass $proxyserver;
}
