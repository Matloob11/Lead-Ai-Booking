# A7: rate-limit heavy REST callers so CRM stays usable on 4 CPU.
# Included from http{} via bx/settings/*.conf
#
# Empty map key => nginx skips limit_req for that client (agents / browsers OK).
#
# Zones:
#   a7_zv_api     — telephony inbound (Zadarma / Voiso): 3 r/s
#   a7_host_api   — Hostinger + AWS automation flood: 2 r/s
#   a7_lg_api     — lead_guard browser poll (all IPs): 2 r/s per IP

map $remote_addr $a7_zv_limit_key {
    default         "";
    # Zadarma Free PBX (bitrix24-php-sdk)
    188.225.26.18   $binary_remote_addr;
    # Voiso recordings / telephony inbound webhook
    45.141.105.11   $binary_remote_addr;
    45.141.105.10   $binary_remote_addr;
}

map $remote_addr $a7_host_limit_key {
    default         "";
    # Hostinger VPS (listing / n8n / node+httpx REST flood)
    187.127.123.235 $binary_remote_addr;
    # AWS us-east automation hitting CRM REST
    34.238.18.189   $binary_remote_addr;
}

limit_req_zone $a7_zv_limit_key zone=a7_zv_api:10m rate=3r/s;
limit_req_zone $a7_host_limit_key zone=a7_host_api:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=a7_lg_api:10m rate=2r/s;
