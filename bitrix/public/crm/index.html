<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A7 WhatsApp — CRM Tab</title>
    <link rel="stylesheet" href="./crm-tab.css" />
  </head>
  <body>
    <!--
      Handler for the four CRM detail tabs. It lists this record's phone numbers
      and says, for each, whether a WhatsApp chat already exists — and the icon
      opens the panel on that chat, inside Bitrix, through
      BX24.openApplication.

      No thread, no composer. Answering a customer needs templates, the 24-hour
      window and the rest of the conversation, all of which live in the panel.
    -->
    <main id="root">
      <div class="loading-state">
        <span class="spinner"></span>
        <span>Looking for WhatsApp chats…</span>
      </div>
    </main>
    <script type="module" src="./crm-tab.js"></script>
  </body>
</html>
