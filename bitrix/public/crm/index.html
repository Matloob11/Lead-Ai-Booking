<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A7 WhatsApp — CRM Tab</title>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var domain = q.get("DOMAIN");
        var sid = q.get("APP_SID");
        var protocol = q.get("PROTOCOL") === "0" ? "0" : "1";
        if (domain && sid && String(window.name || "").split("|").filter(Boolean).length < 3) {
          window.name = domain + "|" + protocol + "|" + sid;
        }
      })();
    </script>
    <script src="/app/assets/core/bx24-early.js"></script>
    <link rel="stylesheet" href="/app/crm/crm-tab.css" />
  </head>
  <body>
    <!--
      Handler for CRM detail tabs (lead / deal / contact / company / Owner Data).
      Lists this record's phone numbers and offers Open with Omni (WABA panel)
      and Open with WhatsApp (Linked devices / OpenWA) for each.

      No thread, no composer here — answering happens in Omni or Linked devices.
    -->
    <main id="root">
      <div class="loading-state">
        <span class="spinner"></span>
        <span>Looking for WhatsApp chats…</span>
      </div>
    </main>
    <script type="module" src="/app/crm/crm-tab.js"></script>
  </body>
</html>
