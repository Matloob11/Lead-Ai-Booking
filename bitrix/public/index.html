<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A7 WhatsApp Inbox</title>
    <!-- window.name before the SDK: official BX24.js throws without APP_SID.
         Do not postMessage getInitData here — a dummy handshake hides Bitrix's
         overlay and then starves BX24.init of AUTH_ID, leaving this page on
         "Signing you in…" forever. The SDK in bx24-early.js must own that call. -->
    <script>
      (function () {
        try {
          document.documentElement.setAttribute(
            "data-wa-theme",
            localStorage.getItem("wa_theme") || "glass-dark"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-wa-theme", "glass-dark");
        }
        if (String(window.name || "").split("|").filter(Boolean).length >= 3) return;
        var q = new URLSearchParams(location.search);
        var d = q.get("DOMAIN");
        var s = q.get("APP_SID");
        if (d && s) window.name = d + "|" + (q.get("PROTOCOL") === "0" ? "0" : "1") + "|" + s;
      })();
    </script>
    <!-- Root-absolute URLs: if Bitrix opens /app (no trailing slash), ./assets/*
         resolves to /assets/* and every stylesheet 404s. /app/assets always
         hits the panel location. -->
    <script src="/app/assets/core/bx24-early.js"></script>
    <link rel="stylesheet" href="/app/assets/modules/panel.css" />
    <link rel="stylesheet" href="/app/assets/modules/inbox.css" />
    <link rel="stylesheet" href="/app/assets/modules/lead-ai/lead-ai.css" />
    <link rel="stylesheet" href="/app/assets/core/lightbox.css" />
    <link rel="stylesheet" href="/app/assets/modules/template-composer.css" />
    <link rel="stylesheet" href="/app/assets/modules/template-center.css" />
    <link rel="stylesheet" href="/app/assets/modules/campaigns.css" />
    <link rel="stylesheet" href="/app/assets/modules/bulk-campaign.css" />
    <link rel="stylesheet" href="/app/assets/modules/rotate-campaign.css?v=2" />
    <link rel="stylesheet" href="/app/assets/modules/numbers-admin.css" />
    <link rel="stylesheet" href="/app/assets/modules/agent-numbers.css" />
    <link rel="stylesheet" href="/app/assets/modules/contact-panel.css" />
    <link rel="stylesheet" href="/app/assets/modules/extras.css" />
    <link rel="stylesheet" href="/app/assets/modules/inbox-ai.css" />
    <link rel="stylesheet" href="/app/assets/modules/report-feedback.css" />
    <link rel="stylesheet" href="/app/assets/modules/reports.css" />
    <link rel="stylesheet" href="/app/assets/modules/admin-kit.css" />
    <link rel="stylesheet" href="/app/assets/modules/official-glass.css" />
    <link rel="stylesheet" href="/app/assets/modules/credit-banner.css" />
  </head>
  <body>
    <script>
      document.body.setAttribute(
        "data-wa-theme",
        document.documentElement.getAttribute("data-wa-theme") || "glass-dark"
      );
    </script>
    <!--
      LEFT_MENU placement handler. Bitrix opens this in an iframe and POSTs the
      placement params; we pick the same values up through the JS SDK instead
      (see assets/core/bitrix-sso.js), swap them for a Django session, and mount the
      inbox. The boot card below is only what the agent sees for that first
      second — and the surface where any failure is reported.
    -->
    <div class="wa-x-glass-bg" aria-hidden="true">
      <div class="wa-x-blob wa-x-b1"></div>
      <div class="wa-x-blob wa-x-b2"></div>
      <div class="wa-x-blob wa-x-b3"></div>
      <div class="wa-x-blob wa-x-b4"></div>
    </div>
    <main class="boot" id="root">
      <section class="card">
        <div class="brand">
          <div class="brand__mark">A7</div>
          <div>
            <div class="brand__name">WhatsApp Inbox</div>
            <div class="brand__sub">A7 Group Real Estate</div>
          </div>
        </div>

        <h1 id="title"><span class="spinner"></span>Signing you in…</h1>
        <p id="subtitle">Verifying your identity with Bitrix24. No separate sign-in is needed.</p>

        <ul class="steps" id="steps">
          <li data-step="bitrix"><span class="steps__dot"></span><span>Token from the Bitrix24 placement</span></li>
          <li data-step="session"><span class="steps__dot"></span><span>Panel session</span></li>
          <li data-step="inbox"><span class="steps__dot"></span><span>Inbox</span></li>
        </ul>

        <div id="result"></div>
      </section>
    </main>

    <script type="module">
      import { ensureSession, ensurePlacement, getBitrixAuth, SsoError } from "/app/assets/core/bitrix-sso.js";

      const root = document.getElementById("root");
      const els = {
        title: document.getElementById("title"),
        subtitle: document.getElementById("subtitle"),
        steps: document.getElementById("steps"),
        result: document.getElementById("result"),
      };

      const setStep = (name, state) =>
        els.steps.querySelector(`[data-step="${name}"]`)?.setAttribute("data-state", state);

      const escape = (value) =>
        String(value ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

      function fail(step, error) {
        setStep(step, "failed");
        els.title.textContent = "The panel could not start";
        els.subtitle.textContent = "Send the details below to your backend team or IT.";

        const code = error instanceof SsoError ? error.code : error?.name || "unknown";
        const detail = error instanceof SsoError ? error.detail : error?.stack;

        els.result.innerHTML = `
          <div class="alert">
            <div class="alert__title">${escape(error?.message || "Unknown error")}</div>
            <div class="alert__code">code: ${escape(code)}</div>
            ${detail ? `<pre>${escape(typeof detail === "string" ? detail : JSON.stringify(detail, null, 2))}</pre>` : ""}
          </div>
          <button class="btn" id="retry">Try again</button>`;
        document.getElementById("retry").addEventListener("click", () => window.location.reload());
        console.error("[a7-wa] boot failed at step:", step, error);
      }

      async function boot() {
        let step = "bitrix";
        try {
          setStep("bitrix", "active");
          els.title.textContent = "Signing you in…";
          const auth = await getBitrixAuth();
          console.info("[a7-wa] bitrix portal:", auth.DOMAIN, "member:", auth.member_id);
          setStep("bitrix", "done");

          step = "session";
          setStep("session", "active");
          const me = await ensureSession();
          setStep("session", "done");

          if (typeof window.BX24.isAdmin === "function" && window.BX24.isAdmin()) {
            // The menu item, and the tab on every CRM record.
            //
            // The CRM tabs are registered from here rather than from their own
            // page, because their own page cannot run until the tab exists to
            // open it — the tab was written, deployed and served, and never
            // appeared in a single lead, because nothing had told Bitrix it was
            // there. install.html can do it too, but nobody opens install.html;
            // an admin opens this panel every day.
            //
            // One at a time: Bitrix answers concurrent placement writes with
            // lock errors often enough that the parallel version reports
            // failures for placements it has in fact bound.
            (async () => {
              const CRM_TABS = [
                "CRM_LEAD_DETAIL_TAB",
                "CRM_DEAL_DETAIL_TAB",
                "CRM_CONTACT_DETAIL_TAB",
                "CRM_COMPANY_DETAIL_TAB",
                "CRM_DYNAMIC_1042_DETAIL_TAB",
              ];
              const menu = await ensurePlacement();
              console.info("[a7-wa] LEFT_MENU:", menu.status);

              // Its own directory, so ensurePlacement binds the CRM handler
              // rather than this page.
              const handler = new URL("./crm/", window.location.href).href;
              for (const placement of CRM_TABS) {
                const r = await ensurePlacement({ placement, title: "WhatsApp", handler });
                console.info(`[a7-wa] ${placement}:`, r.status);
              }
            })().catch((e) => console.warn("[a7-wa] placement registration:", e));
          }

          step = "inbox";
          setStep("inbox", "active");

          // Where to land, when Bitrix sent the agent here rather than them
          // opening the panel themselves. BX24.openApplication carries these
          // through as the placement's options — the CRM tab passes a
          // conversation / Omni number, or linked_phone for Linked devices.
          let openRequest = null;
          try {
            const info =
              typeof window.BX24.placement?.info === "function" ? window.BX24.placement.info() : null;
            const opts = info?.options || {};
            if (opts.linked_phone) openRequest = { linkedPhone: opts.linked_phone };
            else if (opts.conversation_id) openRequest = { conversationId: opts.conversation_id };
            else if (opts.phone) openRequest = { phone: opts.phone };
          } catch (e) {
            console.warn("[a7-wa] no placement options:", e);
          }

          // Inbox is a large module graph. Load it after SSO so a broken
          // import cannot stall BX24.init — that handshake already ran from
          // bx24-early.js; this only paints the panel.
          const { mountInbox } = await import("/app/assets/modules/inbox.js?v=rotate3");
          await mountInbox(root, { me, openRequest });
        } catch (error) {
          fail(step, error);
        }
      }

      boot();
    </script>
    <script type="module" src="/app/assets/modules/extras.js"></script>
    <script type="module" src="/app/assets/modules/inbox-ai.js"></script>
    <script type="module" src="/app/assets/modules/report-feedback.js"></script>
    <script type="module" src="/app/assets/modules/bulk-campaign.js"></script>
    <script type="module" src="/app/assets/modules/rotate-campaign.js?v=3"></script>
    <script type="module" src="/app/assets/modules/credit-banner.js"></script>
    <!-- Lead AI: its own folder and its own entry, so it can never stop the inbox loading. -->
    <script type="module" src="/app/assets/modules/lead-ai/lead-ai.js"></script>
  </body>
</html>
