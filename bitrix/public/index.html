<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A7 WhatsApp Inbox</title>
    <link rel="stylesheet" href="./assets/modules/panel.css" />
    <link rel="stylesheet" href="./assets/modules/inbox.css" />
    <link rel="stylesheet" href="./assets/core/lightbox.css" />
    <link rel="stylesheet" href="./assets/modules/template-composer.css" />
    <link rel="stylesheet" href="./assets/modules/numbers-admin.css" />
    <link rel="stylesheet" href="./assets/modules/contact-panel.css" />
    <link rel="stylesheet" href="./assets/modules/extras.css" />
    <link rel="stylesheet" href="./assets/modules/reports.css" />
  </head>
  <body>
    <!--
      LEFT_MENU placement handler. Bitrix opens this in an iframe and POSTs the
      placement params; we pick the same values up through the JS SDK instead
      (see assets/core/bitrix-sso.js), swap them for a Django session, and mount the
      inbox. The boot card below is only what the agent sees for that first
      second — and the surface where any failure is reported.
    -->
    <main class="boot" id="root">
      <section class="card">
        <div class="brand">
          <div class="brand__mark">A7</div>
          <div>
            <div class="brand__name">WhatsApp Inbox</div>
            <div class="brand__sub">A7 Group Real Estate</div>
          </div>
        </div>

        <h1 id="title"><span class="spinner"></span>Signing you in…</h1>
        <p id="subtitle">Verifying your identity with Bitrix24. No separate sign-in is needed.</p>

        <ul class="steps" id="steps">
          <li data-step="bitrix"><span class="steps__dot"></span><span>Token from the Bitrix24 placement</span></li>
          <li data-step="session"><span class="steps__dot"></span><span>Panel session</span></li>
          <li data-step="inbox"><span class="steps__dot"></span><span>Inbox</span></li>
        </ul>

        <div id="result"></div>
      </section>
    </main>

    <script type="module">
      import { ensureSession, ensurePlacement, getBitrixAuth, SsoError } from "./assets/core/bitrix-sso.js";
      import { mountInbox } from "./assets/modules/inbox.js";

      const root = document.getElementById("root");
      const els = {
        title: document.getElementById("title"),
        subtitle: document.getElementById("subtitle"),
        steps: document.getElementById("steps"),
        result: document.getElementById("result"),
      };

      const setStep = (name, state) =>
        els.steps.querySelector(`[data-step="${name}"]`)?.setAttribute("data-state", state);

      const escape = (value) =>
        String(value ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

      function fail(step, error) {
        setStep(step, "failed");
        els.title.textContent = "The panel could not start";
        els.subtitle.textContent = "Send the details below to your backend team or IT.";

        const code = error instanceof SsoError ? error.code : error?.name || "unknown";
        const detail = error instanceof SsoError ? error.detail : error?.stack;

        els.result.innerHTML = `
          <div class="alert">
            <div class="alert__title">${escape(error?.message || "Unknown error")}</div>
            <div class="alert__code">code: ${escape(code)}</div>
            ${detail ? `<pre>${escape(typeof detail === "string" ? detail : JSON.stringify(detail, null, 2))}</pre>` : ""}
          </div>
          <button class="btn" id="retry">Try again</button>`;
        document.getElementById("retry").addEventListener("click", () => window.location.reload());
        console.error("[a7-wa] boot failed at step:", step, error);
      }

      async function boot() {
        let step = "bitrix";
        try {
          setStep("bitrix", "active");
          const auth = await getBitrixAuth();
          console.info("[a7-wa] bitrix portal:", auth.DOMAIN, "member:", auth.member_id);
          setStep("bitrix", "done");

          step = "session";
          setStep("session", "active");
          const me = await ensureSession();
          setStep("session", "done");

          if (typeof window.BX24.isAdmin === "function" && window.BX24.isAdmin()) {
            // The menu item, and the tab on every CRM record.
            //
            // The CRM tabs are registered from here rather than from their own
            // page, because their own page cannot run until the tab exists to
            // open it — the tab was written, deployed and served, and never
            // appeared in a single lead, because nothing had told Bitrix it was
            // there. install.html can do it too, but nobody opens install.html;
            // an admin opens this panel every day.
            //
            // One at a time: Bitrix answers concurrent placement writes with
            // lock errors often enough that the parallel version reports
            // failures for placements it has in fact bound.
            (async () => {
              const CRM_TABS = [
                "CRM_LEAD_DETAIL_TAB",
                "CRM_DEAL_DETAIL_TAB",
                "CRM_CONTACT_DETAIL_TAB",
                "CRM_COMPANY_DETAIL_TAB",
              ];
              const menu = await ensurePlacement();
              console.info("[a7-wa] LEFT_MENU:", menu.status);

              // Its own directory, so ensurePlacement binds the CRM handler
              // rather than this page.
              const handler = new URL("./crm/", window.location.href).href;
              for (const placement of CRM_TABS) {
                const r = await ensurePlacement({ placement, title: "WhatsApp", handler });
                console.info(`[a7-wa] ${placement}:`, r.status);
              }
            })().catch((e) => console.warn("[a7-wa] placement registration:", e));
          }

          step = "inbox";
          setStep("inbox", "active");
          await mountInbox(root, { me });
        } catch (error) {
          fail(step, error);
        }
      }

      boot();
    </script>
    <script type="module" src="./assets/modules/extras.js"></script>
  </body>
</html>
