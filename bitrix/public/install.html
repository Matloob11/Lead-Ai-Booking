<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A7 WhatsApp Inbox — install</title>
    <link rel="stylesheet" href="./assets/panel.css" />
  </head>
  <body>
    <!--
      Install handler for the Bitrix24 local application. Bitrix loads this once
      when the app is installed; it binds the LEFT_MENU placement (the "WhatsApp"
      item in the portal's main menu) and then reports the install as finished.

      Re-running it is harmless — an already-bound placement is treated as success.
      The Unbind button removes the menu item without uninstalling the app.
    -->
    <main class="boot">
      <section class="card">
        <div class="brand">
          <div class="brand__mark">A7</div>
          <div>
            <div class="brand__name">WhatsApp Inbox</div>
            <div class="brand__sub">Bitrix24 local application setup</div>
          </div>
        </div>

        <h1 id="title"><span class="spinner"></span>Menu item register ho raha hai…</h1>
        <p id="subtitle">LEFT_MENU placement bind kiya ja raha hai.</p>
        <div id="result"></div>
      </section>
    </main>

    <script type="module">
      import { loadBX24, callBitrix } from "./assets/bitrix-sso.js";

      const PLACEMENT = "LEFT_MENU";
      const TITLE = "WhatsApp";
      // The placement opens this directory's index.html — keep the handler URL
      // derived from where this page is served so staging never points at prod.
      const HANDLER = new URL(".", window.location.href).href;

      const els = {
        title: document.getElementById("title"),
        subtitle: document.getElementById("subtitle"),
        result: document.getElementById("result"),
      };

      const escape = (value) =>
        String(value ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

      function ok(message, note) {
        els.title.textContent = message;
        els.subtitle.textContent = note;
        els.result.innerHTML = `
          <dl class="facts">
            <div><dt>Placement</dt><dd>${escape(PLACEMENT)}</dd></div>
            <div><dt>Menu title</dt><dd>${escape(TITLE)}</dd></div>
            <div><dt>Handler</dt><dd>${escape(HANDLER)}</dd></div>
          </dl>
          <button class="btn btn--ghost" id="unbind">Menu item hatayein (unbind)</button>`;
        document.getElementById("unbind").addEventListener("click", unbind);
      }

      function fail(error) {
        els.title.textContent = "Install fail ho gaya";
        els.subtitle.textContent = "App ki settings check karein (scope mein `placement` hona zaroori hai).";
        els.result.innerHTML = `
          <div class="alert">
            <div class="alert__title">${escape(error?.message || "Unknown error")}</div>
            <div class="alert__code">code: ${escape(error?.code || error?.name || "unknown")}</div>
            ${error?.detail ? `<pre>${escape(JSON.stringify(error.detail, null, 2))}</pre>` : ""}
          </div>`;
        console.error("[a7-wa] install failed:", error);
      }

      async function unbind() {
        try {
          await callBitrix("placement.unbind", { PLACEMENT, HANDLER });
          els.result.innerHTML = `<p>Menu item hata diya gaya. Wapas lagane ke liye ye page dobara kholein.</p>`;
        } catch (error) {
          fail(error);
        }
      }

      async function install() {
        try {
          await loadBX24();
          try {
            await callBitrix("placement.bind", { PLACEMENT, HANDLER, TITLE });
            ok("WhatsApp menu item lag gaya", "Left menu refresh karein — item wahan nazar aayega.");
          } catch (error) {
            // Binding the same handler twice is the normal re-install path.
            // Bitrix reports it as a generic ERROR_CORE, so the message — not
            // the code — is what identifies it ("Handler already binded").
            if (/alread|exist/i.test(`${error.code} ${error.message}`)) {
              ok("Menu item pehle se maujood hai", "Kuch badalna nahi para — placement already bound thi.");
            } else {
              throw error;
            }
          }
          if (typeof window.BX24.installFinish === "function") window.BX24.installFinish();
        } catch (error) {
          fail(error);
        }
      }

      install();
    </script>
  </body>
</html>
