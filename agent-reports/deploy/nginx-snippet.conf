# Agent Reports — proxied under /agent-reports/ on the WA panel host.
# Insert inside the HTTPS server block of /etc/nginx/conf.d/a7-wa.conf
# (above the catch-all location /). Idempotent install is handled by
# ops/wa.sh agent-reports-deploy.

location ^~ /agent-reports/ {
    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    add_header Content-Security-Policy "frame-ancestors https://crm.a7grouprealestatedxb.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
}
