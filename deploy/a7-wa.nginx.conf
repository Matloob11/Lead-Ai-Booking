# A7 WhatsApp Agent Inbox - managed by Claude Code.
# Backend: Docker stack listening on 127.0.0.1:8100. Do not merge with other vhosts.

upstream a7_wa_app {
    server 127.0.0.1:8100;
}

server {
    listen 80;
    listen [::]:80;
    server_name wa.srv1802669.hstgr.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/a7-wa-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wa.srv1802669.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/a7-wa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a7-wa/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:a7wa:10m;

    # The panel is rendered inside a Bitrix24 placement iframe, so framing must be
    # allowed from the portal origin only. X-Frame-Options is deliberately omitted;
    # frame-ancestors supersedes it and X-Frame-Options cannot express one allowed origin.
    add_header Content-Security-Policy "frame-ancestors https://crm.a7grouprealestatedxb.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Inbound WhatsApp media can be large; templates and chat payloads are small.
    client_max_body_size 32m;

    access_log /var/log/nginx/a7-wa.access.log main;
    error_log  /var/log/nginx/a7-wa.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/a7-wa-acme;
    }

    location /static/ {
        alias /opt/a7-wa/static/;
        expires 7d;
    }

    # Bitrix placement panel (static). Files: /opt/a7-wa/panel/

    # Linked devices — the QR channel (wa-qr), proxied under the main hostname
    # so the panel can open it in its own iframe.
    #
    # That service has no authentication of its own: it was written to sit on
    # localhost, where being unreachable was the defence. Publishing it here
    # takes that away, so every request is checked against the panel's session
    # first. Without this, anyone who found the URL could link a phone to the
    # company's WhatsApp and read every chat on it.
    location = /_qr_gate {
        internal;
        proxy_pass http://127.0.0.1:8100/api/auth/gate/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /qr/ {
        auth_request /_qr_gate;

        proxy_pass http://127.0.0.1:8300/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A QR that links a phone must not be cached anywhere, and the panel
        # embeds this page, so the same frame-ancestors rule applies.
        # Two ancestors, not one: the inbox panel embeds this page and the
        # panel is served from this same host, while Bitrix embeds the panel.
        # A browser checks the whole chain, so leaving self out refuses the
        # frame with nothing in the page to explain why.
        add_header Content-Security-Policy "frame-ancestors 'self' https://crm.a7grouprealestatedxb.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location /app/ {
        alias /opt/a7-wa/panel/;
        index index.html;
        try_files $uri $uri/ /app/index.html;

        # Bitrix opens a placement handler with an HTTP POST. nginx's static file
        # handler answers POST with 405, so map that back to a plain 200 for the
        # same file. The POST body is discarded on purpose — the page reads its
        # auth via BX24.getAuth() instead of parsing the placement payload.
        error_page 405 =200 $uri;

        # add_header inside a location drops every inherited add_header, so the
        # server-level security headers are repeated here verbatim.
        add_header Content-Security-Policy "frame-ancestors https://crm.a7grouprealestatedxb.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # The handler URL is registered inside Bitrix; a stale cached copy would be
        # painful to flush from every agent's browser.
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://a7_wa_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live chat runs over a WebSocket on this same location.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
