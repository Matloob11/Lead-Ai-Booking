# Panel location block for /etc/nginx/conf.d/a7-wa.conf on the Hostinger VPS.
#
# Paste this INSIDE the existing `server { listen 443 ssl http2; ... }` block,
# above the catch-all `location / { proxy_pass http://a7_wa_app; }`.
# Nothing else in that file changes.
#
# Why a separate location: everything currently proxies to Django on :8100, and
# the Bitrix placement pages are static. Serving them from nginx keeps the panel
# entirely out of the backend session's Django project.

# Exact /app (no trailing slash). GET is redirected so a page at `/app?x=1`
# does not resolve `./assets/*.css` as `/assets/*.css` (the last path segment
# is treated as a file). POST still serves the handler — some Bitrix builds
# POST here and location /app/ never sees them.
location = /app {
    if ($request_method != POST) {
        return 301 /app/$is_args$args;
    }
    default_type text/html;
    alias /opt/a7-wa/panel/index.html;
    error_page 405 =200 /app/index.html;

    add_header Content-Security-Policy "frame-ancestors https://crm.a7grouprealestatedxb.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
}

# Dedicated prefix so a missing stylesheet 404s instead of falling through to
# index.html. `try_files` + `alias` has served the inbox HTML as text/css
# before, which is how the panel appeared unstyled while JS still mounted.
location ^~ /app/assets/ {
    alias /opt/a7-wa/panel/assets/;

    add_header Content-Security-Policy "frame-ancestors https://crm.a7grouprealestatedxb.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
}

location /app/ {
    alias /opt/a7-wa/panel/;
    index index.html;

    # Bitrix opens a placement handler with an HTTP POST. nginx's static file
    # handler answers POST with 405, so map that back to a plain 200 for the
    # same file. The POST body is discarded on purpose — the page reads its
    # auth via BX24.getAuth() instead of parsing the placement payload.
    #
    # $uri, not a fixed page: Bitrix POSTs to install.html during installation,
    # and a hardcoded fallback would silently serve index.html instead — the
    # install handler would never run and the menu item would never appear.
    error_page 405 =200 $uri;

    # add_header inside a location drops every inherited add_header, so the
    # server-level security headers are repeated here verbatim.
    add_header Content-Security-Policy "frame-ancestors https://crm.a7grouprealestatedxb.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The handler URL is registered inside Bitrix; a stale cached copy would be
    # painful to flush from every agent's browser.
    add_header Cache-Control "no-store" always;
}
