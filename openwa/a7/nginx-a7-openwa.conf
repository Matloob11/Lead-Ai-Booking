# OpenWA dashboard + API - managed by Claude Code.
#
# A separate port rather than a path under wa.srv1802669.hstgr.cloud, because the
# dashboard is a single-page app that asks for its own assets at /assets/... and
# its API at /api/... — both absolute. /api/ on the main host already belongs to
# the Django backend, and that collision cannot be proxied around. A separate
# hostname would need a DNS record and a second certificate; a separate port
# needs neither and reuses the certificate already issued for this name.

server {
    # `listen ... http2` rather than the newer `http2 on;` — this nginx predates
    # that directive and refuses to start on it.
    listen 2786 ssl http2;
    listen [::]:2786 ssl http2;
    server_name wa.srv1802669.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/a7-wa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a7-wa/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:a7openwa:10m;

    # Base64 media rides in the JSON body on send. 90 MB raw ≈ 120 MB JSON;
    # 1 GB raw needs the full gigabyte on the wire.
    client_max_body_size 1024m;

    access_log /var/log/nginx/a7-openwa.access.log main;
    error_log  /var/log/nginx/a7-openwa.error.log;

    # The same gate that stands in front of /qr/. OpenWA does have a login of its
    # own — unlike wa-qr, which had none — but that login is a single shared API
    # key, and one key is a thin thing to put between the open internet and an
    # account that can read every WhatsApp conversation the company has. The gate
    # means a request has to carry a valid A7 panel session before OpenWA is ever
    # asked to consider it.
    location = /_openwa_gate {
        internal;
        proxy_pass http://127.0.0.1:8100/api/auth/openwa-gate/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API + WebSocket stay on the running openwa-api container. The SPA is
    # served from the host-built dashboard/dist so a UI ship does not have to
    # recreate that container (read_only rootfs, Chromium sessions).
    location ^~ /api/ {
        auth_request /_openwa_gate;
        auth_request_set $agent_id $upstream_http_x_wa_agent_id;
        auth_request_set $agent_name $upstream_http_x_wa_agent_name;
        auth_request_set $is_admin $upstream_http_x_wa_is_admin;

        proxy_pass http://127.0.0.1:2785;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-WA-Agent-Id     $agent_id;
        proxy_set_header X-WA-Agent-Name   $agent_name;
        proxy_set_header X-WA-Is-Admin     $is_admin;
    }

    location ^~ /socket.io {
        auth_request /_openwa_gate;
        auth_request_set $agent_id $upstream_http_x_wa_agent_id;
        auth_request_set $agent_name $upstream_http_x_wa_agent_name;
        auth_request_set $is_admin $upstream_http_x_wa_is_admin;

        proxy_pass http://127.0.0.1:2785;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-WA-Agent-Id     $agent_id;
        proxy_set_header X-WA-Agent-Name   $agent_name;
        proxy_set_header X-WA-Is-Admin     $is_admin;
    }

    location ^~ /assets/ {
        auth_request /_openwa_gate;
        alias /opt/openwa-trial/OpenWA/dashboard/dist/assets/;
        add_header Cache-Control "no-store" always;
    }

    location / {
        auth_request /_openwa_gate;
        root /opt/openwa-trial/OpenWA/dashboard/dist;
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
    }
}
